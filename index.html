<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixtures Management</title>
  <style>
    /* Global Styles */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    #fixture-app {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
      color: #1e293b;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }

    /* Role Switcher Toolbar */
    .role-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 6px;
    }

    .role-btn {
      flex: 1;
      background: #fff;
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .role-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    /* Accordion Group Styling */
    details {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    summary {
      cursor: pointer;
      padding: 12px;
      font-weight: bold;
      background: #f8fafc;
      user-select: none;
      outline: none;
      border-bottom: 1px solid transparent;
    }

    details[open] > summary {
      border-bottom: 1px solid #e2e8f0;
      background: #f1f5f9;
    }

    .comp-header {
      font-size: 1.05rem;
      color: #0f172a;
    }

    .date-group {
      margin: 10px;
      border: 1px solid #e2e8f0;
    }

    .date-header {
      font-size: 0.95rem;
      color: #475569;
      background: #fff;
    }

    /* Match Items */
    .match-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .match-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #f1f5f9;
      background: #fff;
    }

    .match-item:last-child {
      border-bottom: none;
    }

    .match-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .teams {
      font-weight: 500;
    }

    /* Action Buttons */
    .scorer-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .btn-ht { background-color: #f59e0b; color: white; }
    .btn-ht:hover { background-color: #d97706; }
    
    .btn-ft { background-color: #ef4444; color: white; }
    .btn-ft:hover { background-color: #dc2626; }

    /* Status Badges */
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-upcoming { background: #dcfce7; color: #15803d; }
    .badge-past { background: #f1f5f9; color: #64748b; }
  </style>
</head>
<body>

  <div id="fixture-app">
    <h2>Match Fixtures</h2>
    
    <div class="role-selector">
      <button id="btn-spectator" class="role-btn active" onclick="setFixtureRole('spectator')">Spectator / Admin View</button>
      <button id="btn-scorer" class="role-btn" onclick="setFixtureRole('scorer')">Scorer View</button>
    </div>

    <div id="fixtures-container"></div>
  </div>

  <script>
    /**
     * Fixtures Management Engine
     */
    
    // Core State & Mock Data
    let fixtureState = {
      currentRole: 'spectator', 
      matches: [
        { id: 1, competition: "Premier League", date: "2026-06-12", home: "Manchester City", away: "Liverpool", status: "upcoming" },
        { id: 2, competition: "Premier League", date: "2026-06-10", home: "Chelsea", away: "Arsenal", status: "past" },
        { id: 3, competition: "Champions Cup", date: "2026-06-15", home: "Real Madrid", away: "Bayern Munich", status: "upcoming" },
        { id: 4, competition: "Champions Cup", date: "2026-06-08", home: "PSG", away: "Barcelona", status: "past" }
      ]
    };

    // UI Render function
    function initFixturesApp() {
      const container = document.getElementById('fixtures-container');
      if (!container) return;
      
      container.innerHTML = ''; 

      // Filter matches based on roles
      const filteredMatches = fixtureState.currentRole === 'scorer'
        ? fixtureState.matches.filter(m => m.status === 'upcoming')
        : fixtureState.matches;

      // Group matching elements
      const groupedData = groupMatches(filteredMatches);

      // Build out the nested elements dynamically
      for (const competition in groupedData) {
        const compDetails = document.createElement('details');
        compDetails.className = 'comp-group';
        compDetails.innerHTML = `<summary class="comp-header">${competition}</summary>`;

        for (const date in groupedData[competition]) {
          const dateDetails = document.createElement('details');
          dateDetails.className = 'date-group';
          dateDetails.innerHTML = `<summary class="date-header">${formatDate(date)}</summary>`;

          const matchUl = document.createElement('ul');
          matchUl.className = 'match-list';

          groupedData[competition][date].forEach(match => {
            const matchLi = document.createElement('li');
            matchLi.className = `match-item`;
            
            let matchHTML = `
              <div class="match-info">
                <span class="teams">${match.home} vs ${match.away}</span>
                <span class="badge badge-${match.status}">${match.status}</span>
              </div>
            `;

            // Conditionally append scorer action controls
            if (fixtureState.currentRole === 'scorer') {
              matchHTML += `
                <div class="scorer-actions">
                  <button class="btn btn-ht" onclick="triggerMatchAction('Halftime', ${match.id})">HT</button>
                  <button class="btn btn-ft" onclick="triggerMatchAction('Fulltime', ${match.id})">FT</button>
                </div>
              `;
            }

            matchLi.innerHTML = matchHTML;
            matchUl.appendChild(matchLi);
          });

          dateDetails.appendChild(matchUl);
          compDetails.appendChild(dateDetails);
        }

        container.appendChild(compDetails);
      }
    }

    // Processing Helpers
    function groupMatches(matches) {
      return matches.reduce((acc, match) => {
        if (!acc[match.competition]) acc[match.competition] = {};
        if (!acc[match.competition][match.date]) acc[match.competition][match.date] = [];
        acc[match.competition][match.date].push(match);
        return acc;
      }, {});
    }

    function formatDate(dateString) {
      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      return new Date(dateString).toLocaleDateString(undefined, options);
    }

    // Confirmation Handler
    function triggerMatchAction(actionType, matchId) {
      const targetMatch = fixtureState.matches.find(m => m.id === matchId);
      const matchName = targetMatch ? `${targetMatch.home} vs ${targetMatch.away}` : `Match #${matchId}`;

      const confirmed = confirm(`CONFIRM ACTION\n\nAre you sure you want to declare "${actionType}" for ${matchName}?`);
      
      if (confirmed) {
        console.log(`Action Saved: Match ${matchId} set to ${actionType}`);
        alert(`Status Saved: ${actionType} logged successfully.`);
        
        // Local simulation: moving a finished match to the past category
        if (actionType === 'Fulltime') {
          targetMatch.status = 'past';
          initFixturesApp(); 
        }
      }
    }

    // Role switcher presentation state
    function setFixtureRole(role) {
      fixtureState.currentRole = role;
      
      // Update toggle UI classes
      document.getElementById('btn-spectator').classList.toggle('active', role === 'spectator');
      document.getElementById('btn-scorer').classList.toggle('active', role === 'scorer');
      
      initFixturesApp();
    }

    // Fire application render on document initialization
    document.addEventListener('DOMContentLoaded', initFixturesApp);
  </script>
</body>
</html>
