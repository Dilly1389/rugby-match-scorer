<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rugby Match Scorer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.19.0/iconfont/tabler-icons.min.css"/>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', monospace;
    --color-bg: #0f1117;
    --color-surface: #1a1d27;
    --color-surface2: #222536;
    --color-border: #2e3348;
    --color-border2: #3a3f58;
    --color-text: #e8eaf0;
    --color-text2: #8b91a8;
    --color-text3: #5a6080;
    --color-info: #4f8ef7;
    --color-info-bg: rgba(79,142,247,0.12);
    --color-info-border: rgba(79,142,247,0.3);
    --color-success: #3ecf74;
    --color-success-bg: rgba(62,207,116,0.12);
    --color-warning: #f5a623;
    --color-warning-bg: rgba(245,166,35,0.12);
    --color-warning-border: rgba(245,166,35,0.3);
    --color-danger: #f25f5c;
    --color-danger-bg: rgba(242,95,92,0.12);
    --color-danger-border: rgba(242,95,92,0.3);
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--color-bg); color: var(--color-text); min-height: 100vh; }
  .app { max-width: 680px; margin: 0 auto; }

  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid var(--color-border); background: var(--color-surface); position: sticky; top: 0; z-index: 10; }
  .tab { flex: 1; padding: 14px 10px; font-size: 13px; font-weight: 500; color: var(--color-text2); cursor: pointer; border-bottom: 2px solid transparent; text-align: center; display: flex; align-items: center; justify-content: center; gap: 5px; transition: color 0.15s; }
  .tab.active { color: var(--color-text); border-bottom-color: var(--color-info); }
  .tab:hover:not(.active) { color: var(--color-text); }
  .view { display: none; } .view.active { display: block; }

  /* SHARED */
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text3); margin-bottom: 10px; }
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 1.25rem; }

  /* SCORER */
  .board { padding: 1.25rem 1rem; }
  .fixture-picker { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  .fixture-picker-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text3); margin-bottom: 10px; }
  .fixture-pick-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
  .fixture-pick-row { display: flex; align-items: center; justify-content: space-between; background: var(--color-surface2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 9px 12px; cursor: pointer; transition: border-color 0.15s; }
  .fixture-pick-row:hover { border-color: var(--color-info); }
  .fixture-pick-row.active-fx { border: 2px solid var(--color-info); background: var(--color-info-bg); }
  .fp-teams { font-size: 13px; font-weight: 600; color: var(--color-text); }
  .fp-meta { font-size: 11px; color: var(--color-text2); margin-top: 2px; }
  .fixture-pick-row.active-fx .fp-teams, .fixture-pick-row.active-fx .fp-meta { color: var(--color-info); }
  .fp-right { display: flex; align-items: center; gap: 8px; }
  .fp-score { font-size: 13px; font-family: var(--font-mono); font-weight: 600; color: var(--color-text2); }
  .fixture-pick-row.active-fx .fp-score { color: var(--color-info); }
  .fp-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
  .fp-badge.live { background: var(--color-danger-bg); color: var(--color-danger); border: 1px solid var(--color-danger-border); }
  .fp-badge.ft { background: var(--color-success-bg); color: var(--color-success); }
  .no-fixtures-msg { font-size: 13px; color: var(--color-text2); font-style: italic; }
  .match-header { text-align: center; margin-bottom: 1.1rem; }
  .match-title { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text3); margin-bottom: 4px; }
  .timer-display { font-size: 52px; font-weight: 700; font-family: var(--font-mono); color: var(--color-text); line-height: 1; margin-bottom: 4px; }
  .half-label { font-size: 13px; color: var(--color-text2); }
  .duration-info { font-size: 12px; color: var(--color-text3); margin-top: 3px; }
  .score-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; margin-bottom: 1.25rem; }
  .team-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 1rem; display: flex; flex-direction: column; gap: 10px; }
  .team-name-static { font-size: 15px; font-weight: 700; color: var(--color-text); text-align: center; padding: 4px 0; }
  .score-display { font-size: 64px; font-weight: 700; font-family: var(--font-mono); text-align: center; line-height: 1; color: var(--color-text); }
  .score-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .score-btn { background: var(--color-surface2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 7px 4px; font-size: 11px; font-weight: 600; color: var(--color-text2); cursor: pointer; text-align: center; transition: background 0.1s; }
  .score-btn:hover { background: var(--color-border2); color: var(--color-text); }
  .score-btn:active { transform: scale(0.97); }
  .score-btn .pts { font-size: 16px; font-weight: 700; display: block; color: var(--color-text); }
  .minus-btn { background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 7px; font-size: 18px; color: var(--color-text2); cursor: pointer; width: 100%; text-align: center; }
  .minus-btn:hover { background: var(--color-danger-bg); color: var(--color-danger); border-color: var(--color-danger-border); }
  .vs-col { display: flex; align-items: center; justify-content: center; }
  .vs-text { font-size: 13px; font-weight: 600; color: var(--color-text3); }
  .ctrl-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .ctrl-btn { background: var(--color-surface2); border: 1px solid var(--color-border2); border-radius: var(--radius-sm); padding: 9px 18px; font-size: 13px; font-weight: 600; color: var(--color-text); cursor: pointer; display: flex; align-items: center; gap: 5px; transition: background 0.1s; }
  .ctrl-btn:hover { background: var(--color-border2); }
  .ctrl-btn:active { transform: scale(0.98); }
  .ctrl-btn.primary { background: var(--color-info-bg); color: var(--color-info); border-color: var(--color-info-border); }
  .ctrl-btn.primary:hover { background: rgba(79,142,247,0.2); }
  .ctrl-btn.warning { background: var(--color-warning-bg); color: var(--color-warning); border-color: var(--color-warning-border); }
  .ctrl-btn.warning:hover { background: rgba(245,166,35,0.2); }
  .ctrl-btn.danger { background: var(--color-danger-bg); color: var(--color-danger); border-color: var(--color-danger-border); }
  .ctrl-btn.danger:hover { background: rgba(242,95,92,0.2); }
  .events-section { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 1rem 1.25rem; }
  .events-list { display: flex; flex-direction: column; gap: 5px; max-height: 160px; overflow-y: auto; }
  .event-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--color-text2); padding: 5px 0; border-bottom: 1px solid var(--color-border); }
  .event-item:last-child { border-bottom: none; }
  .event-type { font-weight: 600; color: var(--color-text); }
  .no-events { font-size: 13px; color: var(--color-text2); font-style: italic; }
  .halftime-banner { background: var(--color-warning-bg); border: 1px solid var(--color-warning-border); border-radius: var(--radius-sm); padding: 10px 16px; text-align: center; font-size: 13px; font-weight: 600; color: var(--color-warning); display: none; margin-bottom: 1rem; }
  .no-fixture-selected { text-align: center; padding: 2.5rem 1rem; color: var(--color-text2); font-size: 14px; }
  .no-fixture-selected i { font-size: 32px; display: block; margin-bottom: 10px; color: var(--color-text3); }

  /* FIXTURES TAB */
  .fixtures-wrap { padding: 1.25rem 1rem; }
  .add-fixture-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.25rem; }
  .fixture-form { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
  .fixture-input { font-size: 14px; background: var(--color-surface2); border: 1px solid var(--color-border2); border-radius: var(--radius-sm); padding: 8px 10px; color: var(--color-text); outline: none; width: 100%; text-align: center; }
  .fixture-input:focus { border-color: var(--color-info); }
  .fixture-input::placeholder { color: var(--color-text3); }
  .fixture-vs { font-size: 13px; font-weight: 600; color: var(--color-text3); text-align: center; }
  .fixture-meta-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .fixture-meta-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .fixture-add-btn { width: 100%; background: var(--color-info-bg); color: var(--color-info); border: 1px solid var(--color-info-border); border-radius: var(--radius-sm); padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .fixture-add-btn:hover { background: rgba(79,142,247,0.2); }
  .fixture-list { display: flex; flex-direction: column; gap: 8px; }
  .fixture-row { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .fixture-row.active-fixture { border-color: var(--color-info); }
  .fixture-teams { font-size: 14px; font-weight: 600; color: var(--color-text); }
  .fixture-detail { font-size: 12px; color: var(--color-text2); margin-top: 3px; }
  .fixture-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .fx-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
  .fx-badge.live { background: var(--color-danger-bg); color: var(--color-danger); }
  .fx-badge.ft { background: var(--color-success-bg); color: var(--color-success); }
  .fx-del { background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 14px; color: var(--color-text2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.1s; }
  .fx-del:hover { background: var(--color-danger-bg); color: var(--color-danger); border-color: var(--color-danger-border); }
  .empty-fixtures { font-size: 13px; color: var(--color-text2); font-style: italic; text-align: center; padding: 1.5rem 0; }
  .input-label { font-size: 11px; color: var(--color-text3); margin-bottom: 4px; font-weight: 500; }
  .input-group { display: flex; flex-direction: column; }

  /* SPECTATOR */
  .spectator { padding: 1.5rem 1rem; }
  .spec-fixture-list { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
  .spec-fixture-btn { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: border-color 0.15s; }
  .spec-fixture-btn:hover { border-color: var(--color-info); }
  .spec-fixture-btn.selected { border: 2px solid var(--color-info); background: var(--color-info-bg); }
  .spec-fx-teams { font-size: 14px; font-weight: 600; color: var(--color-text); }
  .spec-fixture-btn.selected .spec-fx-teams { color: var(--color-info); }
  .spec-fx-detail { font-size: 12px; color: var(--color-text2); margin-top: 2px; }
  .spec-fixture-btn.selected .spec-fx-detail { color: var(--color-info); }
  .spec-score-panel { display: none; }
  .spec-meta { text-align: center; margin-bottom: 1.5rem; }
  .spec-league { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text3); margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .spec-half { font-size: 13px; color: var(--color-text2); margin-top: 6px; }
  .spec-timer { font-size: 76px; font-weight: 700; font-family: var(--font-mono); color: var(--color-text); line-height: 1; }
  .spec-scoreline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 1.5rem; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); overflow: hidden; }
  .spec-team { padding: 2rem 1rem; text-align: center; }
  .spec-team-name { font-size: 14px; font-weight: 700; color: var(--color-text2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .spec-score { font-size: 96px; font-weight: 700; font-family: var(--font-mono); color: var(--color-text); line-height: 1; }
  .spec-divider { width: 1px; background: var(--color-border); align-self: stretch; min-height: 140px; }
  .spec-events-box { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 1.25rem; }
  .spec-event-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--color-border); }
  .spec-event-row:last-child { border-bottom: none; }
  .spec-event-team { font-size: 13px; font-weight: 600; color: var(--color-text); }
  .spec-event-type { font-size: 13px; color: var(--color-text2); }
  .spec-event-time { font-size: 13px; font-family: var(--font-mono); color: var(--color-text3); }
  .spec-no-events { font-size: 13px; color: var(--color-text2); font-style: italic; }
  .spec-halftime { background: var(--color-warning-bg); border: 1px solid var(--color-warning-border); border-radius: var(--radius-sm); padding: 10px; text-align: center; font-size: 14px; font-weight: 600; color: var(--color-warning); display: none; margin-bottom: 1.25rem; }
  .leading-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; margin-top: 8px; display: inline-block; background: var(--color-success-bg); color: var(--color-success); }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--color-danger); animation: blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }
  .spec-back-btn { background: var(--color-surface2); border: 1px solid var(--color-border2); border-radius: var(--radius-sm); padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--color-text); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 1.25rem; }
  .spec-back-btn:hover { background: var(--color-border2); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--color-border2); border-radius: 4px; }

  @media(max-width:480px) {
    .spec-score { font-size: 68px; }
    .spec-timer { font-size: 56px; }
    .timer-display { font-size: 42px; }
    .score-display { font-size: 48px; }
    .fixture-meta-grid { grid-template-columns: 1fr 1fr; }
    .fixture-meta-grid > :last-child { grid-column: span 2; }
  }
</style>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

</head>
<body>
<div class="app">
  <div class="tabs" id="app-tabs">
    <div class="tab active" onclick="switchTab('scorer')"><i class="ti ti-pencil"></i> Scorer</div>
    <div class="tab" onclick="switchTab('fixtures')"><i class="ti ti-calendar"></i> Fixtures</div>
    <div class="tab" onclick="switchTab('spectator')"><i class="ti ti-eye"></i> Spectator</div>
  </div>

  <div id="view-scorer" class="view active">
    <div class="board">
      <div class="fixture-
